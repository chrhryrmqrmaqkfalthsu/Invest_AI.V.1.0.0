<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KINGMAKER</title>
<script src="https://unpkg.com/lightweight-charts@4.1.3/dist/lightweight-charts.standalone.production.js"></script>
<style>
  :root{--bg:#0a0e17;--panel:#111722;--panel2:#0d121c;--line:#1c2535;--txt:#c9d4e5;--dim:#5f6e85;
    --up:#26d07c;--down:#ff4d6a;--accent:#3b82f6;--gold:#f5c451;--purple:#8b5cf6;}
  *{box-sizing:border-box;margin:0;padding:0;}
  body{background:var(--bg);color:var(--txt);font-family:"Segoe UI","Malgun Gothic",sans-serif;font-size:13px;}
  .topbar{display:flex;align-items:center;justify-content:space-between;padding:11px 22px;
    border-bottom:1px solid var(--line);background:linear-gradient(90deg,#0d121c,#111722);}
  .logo{font-size:19px;font-weight:800;letter-spacing:2px;}.logo span{color:var(--gold);}
  .nav{display:flex;gap:6px;}
  .nav button{background:transparent;border:1px solid transparent;color:var(--dim);padding:7px 16px;
    border-radius:7px;cursor:pointer;font-weight:600;font-size:13px;transition:.15s;}
  .nav button:hover{color:var(--txt);}
  .nav button.active{background:var(--accent);color:#fff;}
  .regime{display:flex;gap:12px;align-items:center;font-size:12px;}
  .dot{width:8px;height:8px;border-radius:50%;background:var(--up);box-shadow:0 0 8px var(--up);
    animation:pulse 1.5s infinite;display:inline-block;}
  @keyframes pulse{0%,100%{opacity:1;}50%{opacity:.3;}}
  .badge{padding:3px 10px;border-radius:6px;font-weight:700;font-size:11px;text-transform:uppercase;}
  .bull{background:rgba(38,208,124,.15);color:var(--up);}.bear{background:rgba(255,77,106,.15);color:var(--down);}
  .page{display:none;padding:16px 22px;}.page.active{display:block;}
  h3{font-size:11px;text-transform:uppercase;letter-spacing:1.3px;color:var(--dim);margin:6px 2px 11px;font-weight:600;}

  /* 홈: 계좌 카드 */
  .acct{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:18px;}
  .acard{background:var(--panel);border:1px solid var(--line);border-radius:11px;padding:18px;}
  .acard .lab{font-size:11px;color:var(--dim);text-transform:uppercase;letter-spacing:1px;}
  .acard .val{font-size:28px;font-weight:800;margin-top:8px;font-variant-numeric:tabular-nums;}
  .acard .sub{font-size:12px;color:var(--dim);margin-top:5px;}

  .home-grid{display:grid;grid-template-columns:2fr 1fr;gap:18px;}
  .mini-slots{display:grid;grid-template-columns:1fr 1fr;gap:9px;}
  .mslot{background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:12px 14px;cursor:pointer;transition:.15s;}
  .mslot:hover{border-color:var(--accent);transform:translateY(-1px);}
  .mslot.empty{opacity:.35;cursor:default;text-align:center;color:var(--dim);}
  .mslot-top{display:flex;justify-content:space-between;align-items:baseline;}
  .mslot-tk{font-size:16px;font-weight:800;}
  .mslot-pnl{font-weight:700;font-variant-numeric:tabular-nums;}
  .mslot-sub{font-size:11px;color:var(--dim);margin-top:5px;font-variant-numeric:tabular-nums;}

  .panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px;}
  .ev{padding:9px 0;border-bottom:1px solid var(--line);cursor:pointer;}
  .ev:hover{color:#fff;}.ev:last-child{border:none;}
  .ev-risk{color:var(--down);font-weight:700;}.ev-benefit{color:var(--up);font-weight:700;}
  .sector{display:flex;justify-content:space-between;font-size:11px;padding:2px 0;color:var(--dim);}
  .bar{height:5px;background:var(--line);border-radius:3px;overflow:hidden;margin:4px 0 8px;}
  .bar>div{height:100%;background:var(--accent);}

  /* 슬롯 상세 */
  #chart{width:100%;height:440px;}
  .detail-grid{display:grid;grid-template-columns:2.3fr 1fr;gap:16px;}
  .kv{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--line);font-size:13px;}
  .kv span:first-child{color:var(--dim);}.kv span:last-child{font-weight:600;font-variant-numeric:tabular-nums;}
  .tag{display:inline-block;padding:2px 9px;border-radius:5px;background:rgba(139,92,246,.15);color:var(--purple);font-weight:600;font-size:11px;}
  .back{color:var(--accent);cursor:pointer;font-size:13px;margin-bottom:12px;display:inline-block;}
  .back:hover{text-decoration:underline;}
  .tf{background:transparent;border:1px solid var(--line);color:var(--dim);padding:4px 11px;
    border-radius:6px;cursor:pointer;font-size:11px;font-weight:600;transition:.15s;}
  .tf:hover{color:var(--txt);border-color:var(--accent);}
  .tf.active{background:var(--accent);color:#fff;border-color:var(--accent);}

  /* 뉴스 상세 */
  .news-card{background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:14px;margin-bottom:10px;}
  .news-card .nt{color:var(--dim);font-size:11px;margin:4px 0;}
  .news-card a{color:var(--accent);text-decoration:none;font-size:12px;}
  .loading{color:var(--dim);padding:18px;text-align:center;}
</style>
</head>
<body>
  <div class="topbar">
    <div class="logo">KING<span>MAKER</span></div>
    <div class="nav">
      <button class="active" onclick="go('home',this)">홈</button>
      <button onclick="go('slots',this)">슬롯</button>
      <button onclick="go('news',this)">뉴스</button>
    </div>
    <div class="regime" id="regime"><span class="dot"></span> 연결 중...</div>
  </div>

  <!-- 홈 -->
  <div class="page active" id="page-home">
    <div class="acct" id="acct"></div>
    <div class="home-grid">
      <div>
        <h3>📦 보유 슬롯 (8)</h3>
        <div class="mini-slots" id="mini-slots"><div class="loading">로딩...</div></div>
      </div>
      <div>
        <h3>📰 시장 이벤트</h3>
        <div class="panel" id="home-events"><div class="loading">로딩...</div></div>
        <h3 style="margin-top:16px;">📊 섹터 강도</h3>
        <div class="panel" id="home-sectors"><div class="loading">로딩...</div></div>
      </div>
    </div>
  </div>

  <!-- 슬롯 상세 -->
  <div class="page" id="page-slots">
    <div id="slot-list-view">
      <h3>📦 슬롯 클릭 → 상세</h3>
      <div class="mini-slots" id="slots-full"><div class="loading">로딩...</div></div>
    </div>
    <div id="slot-detail-view" style="display:none;">
      <span class="back" onclick="closeDetail()">← 목록으로</span>
      <div class="detail-grid">
        <div class="panel">
          <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:11px;">
            <h3 id="detail-title" style="margin:0;">차트</h3>
            <div id="tf-buttons" style="display:flex;gap:5px;">
              <button class="tf active" data-tf="1d">일봉</button>
              <button class="tf" data-tf="60m">60분</button>
              <button class="tf" data-tf="15m">15분</button>
              <button class="tf" data-tf="5m">5분</button>
              <button class="tf" data-tf="1m">1분</button>
            </div>
          </div>
          <div id="chart"></div>
        </div>
        <div class="panel"><h3 style="margin-top:0;">룰북 / 포지션</h3><div id="detail-kv"></div></div>
      </div>
    </div>
  </div>

  <!-- 뉴스 상세 -->
  <div class="page" id="page-news">
    <h3>📰 시장 이벤트 & 종목 뉴스</h3>
    <div class="detail-grid">
      <div id="news-events"><div class="loading">로딩...</div></div>
      <div class="panel"><h3 style="margin-top:0;">보유 종목 뉴스 점수</h3><div id="news-sentiment"></div></div>
    </div>
  </div>

<script>
const API="http://localhost:8001";
const fmt=(n,d=2)=>n==null?'—':Number(n).toFixed(d);
const usd=n=>n==null?'—':'$'+Number(n).toLocaleString('en-US',{maximumFractionDigits:2});
const pct=n=>n==null?'—':(n>=0?'+':'')+Number(n).toFixed(2)+'%';
const col=n=>n>=0?'var(--up)':'var(--down)';

let slotData=[], marketData={};

function go(page,btn){
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
  document.getElementById('page-'+page).classList.add('active');
  document.querySelectorAll('.nav button').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  if(page==='slots') closeDetail();
}

// ===== 계좌 =====
async function loadAccount(){
  let a; try{ a=await (await fetch(`${API}/api/live/account`)).json(); }catch(e){ return; }
  document.getElementById('acct').innerHTML=`
    <div class="acard"><div class="lab">총 평가금</div>
      <div class="val">${usd(a.total_value)}</div>
      <div class="sub">현금 ${usd(a.cash)} · 투자 ${usd(a.invested)}</div></div>
    <div class="acard"><div class="lab">총 수익률</div>
      <div class="val" style="color:${col(a.total_return_pct)}">${pct(a.total_return_pct)}</div>
      <div class="sub">첫 스냅샷 대비</div></div>
    <div class="acard"><div class="lab">미실현 손익</div>
      <div class="val" style="color:${col(a.unrealized_pnl)}">${a.unrealized_pnl>=0?'+':''}${usd(a.unrealized_pnl)}</div>
      <div class="sub">보유 ${a.holdings_count}종목</div></div>
    <div class="acard"><div class="lab">실현 손익 (누적)</div>
      <div class="val" style="color:${col(a.realized_pnl_total)}">${a.realized_pnl_total>=0?'+':''}${usd(a.realized_pnl_total)}</div>
      <div class="sub">오늘 ${usd(a.realized_pnl_today)} · 오늘 주문 ${a.orders_today??'—'}건</div></div>`;
}

// ===== 슬롯 =====
function slotCard(s,onclick){
  if(s.empty) return `<div class="mslot empty">슬롯 ${s.slot}<br>비어있음</div>`;
  return `<div class="mslot" onclick="${onclick}('${s.ticker}')">
    <div class="mslot-top"><span class="mslot-tk">${s.ticker}</span>
      <span class="mslot-pnl" style="color:${col(s.pnl_pct)}">${pct(s.pnl_pct)}</span></div>
    <div class="mslot-sub">현재 ${fmt(s.current_price)} · 진입 ${fmt(s.entry_price)}</div>
    <div class="mslot-sub">목표 <span style="color:var(--up)">${fmt(s.target_price)}</span> · 손절 <span style="color:var(--down)">${fmt(s.stop_price)}</span></div>
    <div class="mslot-sub"><span class="tag">${s.exit_strategy||'?'}</span> ${s.direction||''} · 최대 ${s.max_holding_days}일</div>
  </div>`;
}
async function loadSlots(){
  try{ slotData=await (await fetch(`${API}/api/live/slots`)).json(); }
  catch(e){ document.getElementById('mini-slots').innerHTML='<div class="loading">API 연결 실패</div>'; return; }
  document.getElementById('mini-slots').innerHTML=slotData.map(s=>slotCard(s,'openDetail')).join('');
  document.getElementById('slots-full').innerHTML=slotData.map(s=>slotCard(s,'openDetail')).join('');
}

// ===== 슬롯 상세 (차트) =====
const chart=LightweightCharts.createChart(document.getElementById('chart'),{
  layout:{background:{color:'transparent'},textColor:'#5f6e85'},
  grid:{vertLines:{color:'#1c2535'},horzLines:{color:'#1c2535'}},
  timeScale:{borderColor:'#1c2535'},rightPriceScale:{borderColor:'#1c2535'},
});
const series=chart.addCandlestickSeries({upColor:'#26d07c',downColor:'#ff4d6a',
  wickUpColor:'#26d07c',wickDownColor:'#ff4d6a',borderVisible:false});
let priceLines=[];
let curTicker=null, curInterval='1d';

async function drawChart(ticker, interval){
  curTicker=ticker; curInterval=interval;
  const intraday = !['1d','1wk','1mo'].includes(interval);
  chart.applyOptions({ timeScale:{ timeVisible:intraday, secondsVisible:false, borderColor:'#1c2535' } });
  let candles=[];
  try{ candles=await (await fetch(`${API}/api/live/candles/${ticker}?interval=${interval}`)).json(); }catch(e){}
  series.setData(candles);
  const s=slotData.find(x=>x.ticker===ticker);
  priceLines.forEach(l=>series.removePriceLine(l)); priceLines=[];
  if(s){
    [['진입',s.entry_price,'#3b82f6'],['목표',s.target_price,'#26d07c'],
     ['손절',s.stop_price,'#ff4d6a'],['트레일',s.trailing_stop,'#f5c451'],
     ['현재',s.current_price,'#c9d4e5']].forEach(([t,p,c])=>{
      if(p==null) return;
      priceLines.push(series.createPriceLine({price:p,color:c,lineWidth:t==='현재'?2:1,
        lineStyle:t==='현재'?0:2,axisLabelVisible:true,title:t}));
    });
  }
  if(candles.length){
    chart.resize(document.getElementById('chart').clientWidth, 440);
    // 간격별로 보여줄 최근 캔들 개수 (없으면 전체)
    const visibleBars = {'1m':80, '5m':80, '15m':70, '60m':60, '1d':120};
    const n = visibleBars[interval];
    if(n && candles.length > n){
      chart.timeScale().setVisibleLogicalRange({ from: candles.length - n, to: candles.length + 2 });
    }else{
      chart.timeScale().fitContent();
    }
  }
}

async function openDetail(ticker){
  // 슬롯 탭으로 전환 + 상세뷰 표시
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
  document.getElementById('page-slots').classList.add('active');
  document.querySelectorAll('.nav button').forEach(b=>b.classList.remove('active'));
  document.querySelectorAll('.nav button')[1].classList.add('active');
  document.getElementById('slot-list-view').style.display='none';
  document.getElementById('slot-detail-view').style.display='block';
  chart.resize(document.getElementById('chart').clientWidth, 440);

  const s=slotData.find(x=>x.ticker===ticker); if(!s) return;
  document.getElementById('detail-title').textContent=`${ticker} — 보유 차트`;
  // 캔들 (간격 버튼은 일봉으로 리셋)
  document.querySelectorAll('.tf').forEach(b=>b.classList.toggle('active', b.dataset.tf==='1d'));
  await drawChart(ticker, '1d');
  // 룰북/포지션 표
  document.getElementById('detail-kv').innerHTML=`
    <div class="kv"><span>현재가</span><span>${fmt(s.current_price)}</span></div>
    <div class="kv"><span>손익률</span><span style="color:${col(s.pnl_pct)}">${pct(s.pnl_pct)}</span></div>
    <div class="kv"><span>진입가</span><span>${fmt(s.entry_price)}</span></div>
    <div class="kv"><span>목표가</span><span style="color:var(--up)">${fmt(s.target_price)}</span></div>
    <div class="kv"><span>손절가</span><span style="color:var(--down)">${fmt(s.stop_price)}</span></div>
    <div class="kv"><span>트레일링</span><span style="color:var(--gold)">${fmt(s.trailing_stop)}</span></div>
    <div class="kv"><span>수량</span><span>${fmt(s.shares,4)}</span></div>
    <div class="kv"><span>방향</span><span>${s.direction||'—'}</span></div>
    <div class="kv"><span>청산 전략</span><span>${s.exit_strategy||'—'}</span></div>
    <div class="kv"><span>최대 보유</span><span>${s.max_holding_days}일</span></div>
    <div class="kv"><span>진입일</span><span>${(s.entry_date||'').slice(0,10)}</span></div>`;
}
function closeDetail(){
  document.getElementById('slot-detail-view').style.display='none';
  document.getElementById('slot-list-view').style.display='block';
}

// ===== 시장 / 뉴스 =====
async function loadMarket(){
  try{ marketData=await (await fetch(`${API}/api/live/market`)).json(); }catch(e){ return; }
  const m=marketData, rb=m.regime==='bull'?'bull':'bear';
  document.getElementById('regime').innerHTML=
    `<span class="dot"></span> <span class="badge ${rb}">${m.regime||'?'}</span>
     점수 ${m.score??'?'} · VIX ${m.vix_level??'?'}`;
  // 이벤트 요약 (홈)
  let ev='';
  (m.risk_events||[]).forEach(e=>ev+=`<div class="ev" onclick="document.querySelectorAll('.nav button')[2].click()"><span class="ev-risk">▼</span> ${e}</div>`);
  (m.benefit_events||[]).forEach(e=>ev+=`<div class="ev" onclick="document.querySelectorAll('.nav button')[2].click()"><span class="ev-benefit">▲</span> ${e}</div>`);
  document.getElementById('home-events').innerHTML=ev||'<div class="loading">이벤트 없음</div>';
  // 섹터
  const sec=m.sector_strength||{};
  document.getElementById('home-sectors').innerHTML=Object.entries(sec).map(([k,v])=>
    `<div class="sector"><span>${k}</span><span>${v}</span></div><div class="bar"><div style="width:${v}%"></div></div>`).join('')||'—';
  // 뉴스 페이지 상세
  const act=m.active_events||{};
  let detail='';
  Object.entries(act).forEach(([name,d])=>{
    const arts=(d.articles||[]).map(a=>`<div class="nt">· ${a.title||''} ${a.url?`<a href="${a.url}" target="_blank">[링크]</a>`:''}</div>`).join('');
    const ic=d.market_impact==='악재'?'var(--down)':'var(--up)';
    detail+=`<div class="news-card"><b style="color:${ic}">${name}</b>
      <span class="nt">(${d.market_impact||''}, 영향도 ${d.total_impact_score})</span>${arts}</div>`;
  });
  document.getElementById('news-events').innerHTML=detail||'<div class="loading">활성 이벤트 없음</div>';
}

async function loadNews(){
  let n; try{ n=await (await fetch(`${API}/api/live/news`)).json(); }catch(e){ return; }
  const sent=(n.sentiment||{}).entries||{};
  const rows=Object.values(sent).map(e=>
    `<div class="kv"><span>${e.ticker}</span>
     <span style="color:${e.score>=0?'var(--up)':'var(--down)'}">${fmt(e.score,3)} <small style="color:var(--dim)">(${e.article_count||0}건)</small></span></div>`).join('');
  document.getElementById('news-sentiment').innerHTML=rows||'<div class="loading">데이터 없음</div>';
}

document.querySelectorAll('.tf').forEach(btn=>{
  btn.onclick=()=>{
    document.querySelectorAll('.tf').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    if(curTicker) drawChart(curTicker, btn.dataset.tf);
  };
});

// ===== 초기 로드 + 주기 갱신 =====
function refresh(){ loadAccount(); loadSlots(); loadMarket(); loadNews(); }
refresh();
setInterval(refresh, 30000);
</script>
</body>
</html>
