<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KINGMAKER</title>
<script src="https://unpkg.com/lightweight-charts@4.1.3/dist/lightweight-charts.standalone.production.js"></script>
<style>
  :root{--bg:#0a0e17;--panel:#111722;--panel2:#0d121c;--line:#1c2535;--txt:#c9d4e5;--dim:#5f6e85;
    --up:#26d07c;--down:#ff4d6a;--accent:#3b82f6;--gold:#f5c451;--purple:#8b5cf6;}
  *{box-sizing:border-box;margin:0;padding:0;}
  body{background:var(--bg);color:var(--txt);font-family:"Segoe UI","Malgun Gothic",sans-serif;font-size:13px;}
  .topbar{display:flex;align-items:center;justify-content:space-between;padding:11px 22px;
    border-bottom:1px solid var(--line);background:linear-gradient(90deg,#0d121c,#111722);}
  .logo{font-size:19px;font-weight:800;letter-spacing:2px;}.logo span{color:var(--gold);}
  .nav{display:flex;gap:6px;}
  .nav button{background:transparent;border:1px solid transparent;color:var(--dim);padding:7px 16px;
    border-radius:7px;cursor:pointer;font-weight:600;font-size:13px;transition:.15s;}
  .nav button:hover{color:var(--txt);}
  .nav button.active{background:var(--accent);color:#fff;}
  #fs-btn{font-size:15px;padding:6px 12px;}
  .regime{display:flex;gap:12px;align-items:center;font-size:12px;}
  .dot{width:8px;height:8px;border-radius:50%;background:var(--up);box-shadow:0 0 8px var(--up);
    animation:pulse 1.5s infinite;display:inline-block;}
  @keyframes pulse{0%,100%{opacity:1;}50%{opacity:.3;}}
  .badge{padding:3px 10px;border-radius:6px;font-weight:700;font-size:11px;text-transform:uppercase;}
  .bull{background:rgba(38,208,124,.15);color:var(--up);}.bear{background:rgba(255,77,106,.15);color:var(--down);}
  .page{display:none;padding:16px 22px;}.page.active{display:block;}
  h3{font-size:11px;text-transform:uppercase;letter-spacing:1.3px;color:var(--dim);margin:6px 2px 11px;font-weight:600;}

  /* 홈: 계좌 카드 */
  .acct{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:18px;}
  .acard{background:var(--panel);border:1px solid var(--line);border-radius:11px;padding:18px;}
  .acard .lab{font-size:11px;color:var(--dim);text-transform:uppercase;letter-spacing:1px;}
  .acard .val{font-size:28px;font-weight:800;margin-top:8px;font-variant-numeric:tabular-nums;}
  .acard .sub{font-size:12px;color:var(--dim);margin-top:5px;}

  .home-grid{display:grid;grid-template-columns:2fr 1fr;gap:18px;}
  .mini-slots{display:grid;grid-template-columns:1fr 1fr;gap:9px;}
  .mslot{background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:12px 14px;cursor:pointer;transition:.15s;}
  .mslot:hover{border-color:var(--accent);transform:translateY(-1px);}
  .mslot.empty{opacity:.35;cursor:default;text-align:center;color:var(--dim);}
  .mslot-top{display:flex;justify-content:space-between;align-items:baseline;}
  .mslot-tk{font-size:16px;font-weight:800;}
  .mslot-pnl{font-weight:700;font-variant-numeric:tabular-nums;}
  .mslot-sub{font-size:11px;color:var(--dim);margin-top:5px;font-variant-numeric:tabular-nums;}
  .gauge{margin-top:8px;}
  .gauge-bar{position:relative;height:7px;border-radius:4px;
    background:linear-gradient(90deg,var(--down) 0%,#5f6e85 50%,var(--up) 100%);}
  .gauge-mark{position:absolute;top:-3px;width:3px;height:13px;background:#fff;
    border-radius:2px;box-shadow:0 0 5px rgba(255,255,255,.8);transform:translateX(-50%);}
  .gauge-labels{display:flex;justify-content:space-between;font-size:10px;color:var(--dim);margin-top:3px;}

  .panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px;}
  .panel-head{display:flex;align-items:center;justify-content:space-between;font-weight:700;font-size:13px;margin-bottom:11px;}
  .ev{padding:9px 0;border-bottom:1px solid var(--line);cursor:pointer;}
  .ev:hover{color:#fff;}.ev:last-child{border:none;}
  .ev-risk{color:var(--down);font-weight:700;}.ev-benefit{color:var(--up);font-weight:700;}
  .sector{display:flex;justify-content:space-between;font-size:11px;padding:2px 0;color:var(--dim);}
  .bar{height:5px;background:var(--line);border-radius:3px;overflow:hidden;margin:4px 0 8px;}
  .bar>div{height:100%;background:var(--accent);}
  .cand-list{display:flex;flex-direction:column;gap:8px;}
  .cand-empty{color:var(--dim);font-size:13px;padding:16px;text-align:center;}
  .cand-card{display:flex;align-items:center;justify-content:space-between;
    background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:12px 14px;cursor:pointer;}
  .cand-card:hover{border-color:var(--accent);}
  .cand-info{display:flex;flex-direction:column;gap:4px;}
  .cand-tkr{font-weight:700;font-size:15px;color:var(--txt);}
  .cand-chg{font-size:12px;font-weight:700;margin-left:6px;}
  .cand-fill{color:var(--accent);font-weight:700;}
  .cand-sub{font-size:12px;color:var(--dim);font-variant-numeric:tabular-nums;}
  .cand-right{display:flex;align-items:center;gap:10px;}
  .cand-badge{font-size:11px;padding:3px 9px;border-radius:20px;font-weight:600;white-space:nowrap;}
  .b-pending{background:rgba(38,208,124,.15);color:var(--up);}
  .b-requested{background:rgba(245,196,81,.15);color:var(--gold);}
  .b-executed{background:rgba(59,130,246,.15);color:var(--accent);}
  .b-auto{background:rgba(139,92,246,.15);color:var(--purple);}
  .b-blocked{background:rgba(255,77,106,.15);color:var(--down);}
  .b-expired{background:rgba(95,110,133,.15);color:var(--dim);}
  .cand-buy{background:#2d6a4f;color:#fff;border:none;border-radius:8px;
    padding:8px 16px;font-size:13px;font-weight:600;cursor:pointer;}
  .cand-buy:hover{background:#358760;}
  .cand-buy:disabled{background:#2a2f38;color:var(--dim);cursor:not-allowed;}
  .cand-buy.processing{background:#5c5220;color:var(--gold);}
  .univ-note{font-size:11px;color:#c9a227;background:#2a2410;
    border:1px solid #3a3320;border-radius:6px;padding:6px 10px;margin-bottom:10px;}
  .univ-pos{color:var(--up);}
  .univ-neg{color:var(--down);}
  .cand-modal{position:fixed;inset:0;background:rgba(0,0,0,0.7);
    display:flex;align-items:center;justify-content:center;z-index:1000;}
  .cand-modal-box{background:#0f141b;border:1px solid var(--line);border-radius:14px;
    padding:18px;width:min(720px,92vw);box-shadow:0 12px 40px rgba(0,0,0,.55);}
  .cand-modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;}
  .cm-summary{display:flex;gap:18px;margin-bottom:12px;font-size:13px;color:#b8c1cf;}
  .cm-summary .big{font-size:24px;font-weight:700;font-variant-numeric:tabular-nums;}
  .cm-chart{height:340px;width:100%;}

  /* 슬롯 상세 */
  #chart{width:100%;height:440px;}
  .detail-grid{display:grid;grid-template-columns:2.3fr 1fr;gap:16px;}
  .kv{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--line);font-size:13px;}
  .kv span:first-child{color:var(--dim);}.kv span:last-child{font-weight:600;font-variant-numeric:tabular-nums;}
  .tag{display:inline-block;padding:2px 9px;border-radius:5px;background:rgba(139,92,246,.15);color:var(--purple);font-weight:600;font-size:11px;}
  .back{color:var(--accent);cursor:pointer;font-size:13px;margin-bottom:12px;display:inline-block;}
  .back:hover{text-decoration:underline;}
  .tf{background:transparent;border:1px solid var(--line);color:var(--dim);padding:4px 11px;
    border-radius:6px;cursor:pointer;font-size:11px;font-weight:600;transition:.15s;}
  .tf:hover{color:var(--txt);border-color:var(--accent);}
  .tf.active{background:var(--accent);color:#fff;border-color:var(--accent);}
  .rb-stats{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin:12px 0;}
  .rb-stat{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:10px;text-align:center;}
  .rb-stat .v{font-size:18px;font-weight:800;font-variant-numeric:tabular-nums;}
  .rb-stat .l{font-size:10px;color:var(--dim);text-transform:uppercase;margin-top:3px;}
  .rb-sec{border:1px solid var(--line);border-radius:8px;margin-bottom:8px;overflow:hidden;}
  .rb-sec-h{padding:10px 13px;cursor:pointer;font-weight:600;font-size:12px;
    display:flex;justify-content:space-between;background:var(--panel2);}
  .rb-sec-h:hover{color:#fff;}
  .rb-sec-b{padding:4px 13px 10px;display:none;}
  .rb-sec.open .rb-sec-b{display:block;}
  .rb-sec.open .rb-arrow{transform:rotate(90deg);}
  .rb-arrow{transition:.2s;color:var(--dim);}
  .rb-kv{display:flex;justify-content:space-between;padding:5px 0;font-size:12px;border-bottom:1px solid var(--line);}
  .rb-kv:last-child{border:none;}
  .rb-kv span:first-child{color:var(--dim);}
  .rb-kv span:last-child{font-weight:600;font-variant-numeric:tabular-nums;}
  .cmt-block{margin-bottom:13px;}
  .cmt-block .cmt-h{font-size:11px;color:var(--dim);text-transform:uppercase;letter-spacing:1px;margin-bottom:7px;}
  .cmt-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;}
  .cmt-item{background:var(--panel2);border:1px solid var(--line);border-radius:7px;padding:9px;text-align:center;}
  .cmt-item .v{font-size:15px;font-weight:700;font-variant-numeric:tabular-nums;}
  .cmt-item .l{font-size:10px;color:var(--dim);margin-top:2px;}
  .cmt-status{padding:11px 13px;border-radius:8px;background:var(--panel2);border:1px solid var(--line);
    font-size:13px;line-height:1.6;margin-bottom:11px;}
  .cmt-status b{color:var(--accent);}
  .cmt-note{font-size:11px;color:var(--dim);font-style:italic;border-top:1px solid var(--line);
    padding-top:9px;margin-top:4px;}
  .pill{display:inline-block;padding:2px 9px;border-radius:5px;font-size:11px;font-weight:600;margin-right:5px;}
  .pill-ok{background:rgba(38,208,124,.15);color:var(--up);}
  .pill-warn{background:rgba(255,77,106,.15);color:var(--down);}
  .pill-neutral{background:rgba(95,110,133,.15);color:var(--dim);}

  /* 뉴스 상세 */
  .news-card{background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:14px;margin-bottom:10px;}
  .news-card .nt{color:var(--dim);font-size:11px;margin:4px 0;}
  .news-card a{color:var(--accent);text-decoration:none;font-size:12px;}
  .loading{color:var(--dim);padding:18px;text-align:center;}

  /* 거래내역 */
  .trow{display:grid;grid-template-columns:1.2fr .8fr 1fr 1fr 1fr .9fr 1.2fr;
    padding:11px 16px;border-bottom:1px solid var(--line);font-size:12px;
    font-variant-numeric:tabular-nums;align-items:center;}
  .trow.head{color:var(--dim);font-size:11px;text-transform:uppercase;letter-spacing:.5px;}
  .trow .tk{font-weight:700;font-size:13px;}
  .reason{padding:2px 8px;border-radius:5px;font-size:11px;font-weight:600;}
  .r-stop{background:rgba(255,77,106,.15);color:var(--down);}
  .r-target{background:rgba(38,208,124,.15);color:var(--up);}
  .r-other{background:rgba(95,110,133,.15);color:var(--dim);}

  /* 토스트 알림 */
  .toast-wrap{position:fixed;bottom:20px;right:20px;display:flex;flex-direction:column;
    gap:9px;z-index:9999;max-width:320px;}
  .toast{background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--accent);
    border-radius:9px;padding:12px 15px;box-shadow:0 6px 20px rgba(0,0,0,.4);
    animation:toastin .35s;font-size:13px;}
  .toast.warn{border-left-color:var(--down);}
  .toast.good{border-left-color:var(--up);}
  .toast .tt{font-weight:700;margin-bottom:3px;}
  .toast .tb{color:var(--dim);font-size:12px;}
  @keyframes toastin{from{opacity:0;transform:translateX(30px);}to{opacity:1;}}
  .toast.fade{opacity:0;transform:translateX(30px);transition:.4s;}
</style>
</head>
<body>
  <div class="topbar">
    <div id="clock-box" style="line-height:1.3;">
      <div id="clock" style="font-size:16px;font-weight:800;font-variant-numeric:tabular-nums;">--:--:--</div>
      <div id="market-status" style="font-size:11px;color:var(--dim);">미국장 확인 중...</div>
    </div>
    <div class="nav">
      <button class="active" onclick="go('home',this)">홈</button>
      <button onclick="go('slots',this)">슬롯</button>
      <button onclick="go('news',this)">뉴스</button>
      <button onclick="go('history',this)">거래내역</button>
      <button id="fs-btn" onclick="toggleFullscreen()" title="전체화면">⛶</button>
    </div>
    <div class="regime" id="regime"><span class="dot"></span> 연결 중...</div>
  </div>

  <!-- 홈 -->
  <div class="page active" id="page-home">
    <div class="acct" id="acct"></div>
    <div class="panel" style="margin-bottom:18px;">
      <h3 style="margin-top:0;">📈 자산 추이</h3>
      <div id="equity-chart" style="width:100%;height:220px;"></div>
    </div>
    <div id="candidates-panel" class="panel" style="margin-bottom:16px;">
      <div class="panel-head">
        <span>🛒 매수 대기 후보</span>
        <span id="cand-meta" style="font-size:12px;color:var(--dim);"></span>
      </div>
      <div id="cand-list" class="cand-list">
        <div class="cand-empty">대기 중인 후보 없음</div>
      </div>
    </div>
    <div class="home-grid">
      <div>
        <h3>📦 보유 슬롯 (8)</h3>
        <div class="mini-slots" id="mini-slots"><div class="loading">로딩...</div></div>
      </div>
      <div>
        <h3>📰 시장 이벤트</h3>
        <div class="panel" id="home-events"><div class="loading">로딩...</div></div>
        <h3 style="margin-top:16px;">📊 섹터 강도</h3>
        <div class="panel" id="home-sectors"><div class="loading">로딩...</div></div>
      </div>
    </div>
  </div>

  <!-- 슬롯 상세 -->
  <div class="page" id="page-slots">
    <div id="slot-list-view">
      <h3>📦 슬롯 클릭 → 상세</h3>
      <div class="mini-slots" id="slots-full"><div class="loading">로딩...</div></div>
    </div>
    <div id="slot-detail-view" style="display:none;">
      <span class="back" onclick="closeDetail()">← 목록으로</span>
      <div class="detail-grid">
        <div>
          <div class="panel">
            <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:11px;">
              <h3 id="detail-title" style="margin:0;">차트</h3>
              <div id="tf-buttons" style="display:flex;gap:5px;">
                <button class="tf active" data-tf="1d">일봉</button>
                <button class="tf" data-tf="60m">60분</button>
                <button class="tf" data-tf="15m">15분</button>
                <button class="tf" data-tf="5m">5분</button>
                <button class="tf" data-tf="1m">1분</button>
              </div>
            </div>
            <div id="chart"></div>
          </div>
          <div class="panel" style="margin-top:14px;" id="commentary-panel">
            <h3 style="margin-top:0;">🧭 포지션 해설</h3>
            <div id="commentary"><div class="loading">슬롯을 선택하세요</div></div>
          </div>
        </div>
        <div class="panel"><h3 style="margin-top:0;">룰북 / 포지션</h3><div id="detail-kv"></div></div>
      </div>
    </div>
  </div>

  <!-- 뉴스 상세 -->
  <div class="page" id="page-news">
    <h3>📰 시장 이벤트 & 종목 뉴스</h3>
    <div class="detail-grid">
      <div id="news-events"><div class="loading">로딩...</div></div>
      <div class="panel"><h3 style="margin-top:0;">보유 종목 뉴스 점수</h3><div id="news-sentiment"></div></div>
    </div>
  </div>

  <!-- 거래내역 -->
  <div class="page" id="page-history">
    <h3>📜 거래 통계</h3>
    <div class="acct" id="hist-stats" style="grid-template-columns:repeat(5,1fr);"></div>
    <h3 style="margin-top:18px;">청산 거래 내역</h3>
    <div class="panel" style="padding:0;">
      <div id="hist-table"><div class="loading">로딩...</div></div>
    </div>
  </div>

<script>
const API="http://localhost:8001";
const fmt=(n,d=2)=>n==null?'—':Number(n).toFixed(d);
const usd=n=>n==null?'—':'$'+Number(n).toLocaleString('en-US',{maximumFractionDigits:2});
const pct=n=>n==null?'—':(n>=0?'+':'')+Number(n).toFixed(2)+'%';
const col=n=>n>=0?'var(--up)':'var(--down)';

let slotData=[], marketData={};
let _alertState={ near:{}, lastTradeId:null, firstRun:true };
const CAND_BADGE = {
  pending: {cls:'b-pending', txt:'매수 가능'},
  manual_requested: {cls:'b-requested', txt:'처리 중'},
  manual_executed: {cls:'b-executed', txt:'수동 체결'},
  auto_executed: {cls:'b-auto', txt:'자동 체결'},
  blocked: {cls:'b-blocked', txt:'차단됨'},
  expired: {cls:'b-expired', txt:'만료'},
};
const _candBusy = {};
const _candPrice = {};
const _posEntry = {};
const _posCurrent = {};
let _candChart = null, _candSeries = null;

function toast(title, body, type){
  const wrap=document.getElementById('toasts');
  const el=document.createElement('div');
  el.className='toast '+(type||'');
  el.innerHTML=`<div class="tt">${title}</div><div class="tb">${body}</div>`;
  wrap.appendChild(el);
  setTimeout(()=>{ el.classList.add('fade'); setTimeout(()=>el.remove(),400); }, 6000);
}
function htmlEsc(v){
  return String(v??'').replace(/[&<>"']/g, ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
}
function changePct(signalPrice, curPrice){
  if(!signalPrice || !curPrice) return null;
  return ((curPrice - signalPrice) / signalPrice) * 100;
}
async function fetchCandPrice(ticker){
  try{
    const r = await fetch(`${API}/api/live/candles/${ticker}?interval=1m`);
    const d = await r.json();
    if(Array.isArray(d) && d.length){
      return d[d.length-1].close;
    }
  }catch(e){}
  return null;
}
async function loadPositionEntries(){
  try{
    const r = await fetch(`${API}/api/live/slots`);
    const slots = await r.json();
    Object.keys(_posEntry).forEach(k=>delete _posEntry[k]);
    Object.keys(_posCurrent).forEach(k=>delete _posCurrent[k]);
    (Array.isArray(slots) ? slots : []).filter(s=>!s.empty).forEach(s=>{
      const tk = String(s.ticker || '').toUpperCase();
      const entry = s.entry_price ?? s.avg_cost;
      const cur = s.current_price;
      if(tk && entry!=null) _posEntry[tk] = Number(entry);
      if(tk && cur!=null) _posCurrent[tk] = Number(cur);
    });
  }catch(e){}
}

// 슬롯 데이터 받을 때마다 손절/목표 임박 체크
function checkSlotAlerts(slots){
  slots.forEach(s=>{
    if(s.empty || s.stop_price==null || s.target_price==null || s.current_price==null) return;
    if(s.target_price<=s.stop_price) return;
    const pos=(s.current_price-s.stop_price)/(s.target_price-s.stop_price); // 0~1
    let zone=null;
    if(pos<=0.12) zone='stop';
    else if(pos>=0.88) zone='target';
    const prev=_alertState.near[s.ticker];
    if(zone && zone!==prev && !_alertState.firstRun){
      if(zone==='stop') toast(`⚠️ ${s.ticker} 손절 임박`,
        `현재 ${fmt(s.current_price)} / 손절 ${fmt(s.stop_price)}`, 'warn');
      else toast(`🎯 ${s.ticker} 목표 임박`,
        `현재 ${fmt(s.current_price)} / 목표 ${fmt(s.target_price)}`, 'good');
    }
    _alertState.near[s.ticker]=zone;
  });
}

// 거래내역 받을 때 새 청산 체크
function checkTradeAlerts(trades){
  if(!trades || !trades.length) return;
  const latest=trades[0];
  const id=latest.exited_at;
  if(_alertState.lastTradeId!==null && id!==_alertState.lastTradeId && !_alertState.firstRun){
    const good=(latest.pnl_pct||0)>=0;
    toast(`${good?'✅':'❌'} ${latest.ticker} 청산`,
      `${latest.exit_reason||''} · ${pct(latest.pnl_pct)}`, good?'good':'warn');
  }

}

async function loadCandidates(){
  let state;
  try{
    const r = await fetch(`${API}/api/live/central_candidates`);
    state = await r.json();
  }catch(e){
    document.getElementById('cand-list').innerHTML = '<div class="cand-empty">후보 조회 실패</div>';
    return;
  }
  const cands = Object.values(state.candidates || {}).filter(x=>x && typeof x==='object');
  const meta = document.getElementById('cand-meta');
  meta.textContent = state.trade_date ? `거래일 ${state.trade_date}` : '';
  if(cands.length===0){
    document.getElementById('cand-list').innerHTML = '<div class="cand-empty">대기 중인 후보 없음</div>';
    return;
  }
  await loadPositionEntries();
  await Promise.all(cands.map(async c=>{
    if(c.ticker) _candPrice[c.ticker] = await fetchCandPrice(c.ticker);
  }));
  document.getElementById('cand-list').innerHTML = cands.map(candCard).join('');
  document.querySelectorAll('.cand-card[data-cand-ticker]').forEach(card=>{
    card.onclick=()=>openCandChart(
      card.dataset.candTicker,
      Number(card.dataset.signalPrice || 0),
      Number(card.dataset.fillPrice || 0)
    );
  });
  document.querySelectorAll('.cand-buy[data-candidate-id]').forEach(btn=>{
    btn.onclick=(ev)=>{ ev.stopPropagation(); requestBuy(btn.dataset.candidateId); };
  });
}
function candCard(c){
  const st = c.status || 'pending';
  const b = CAND_BADGE[st] || CAND_BADGE.expired;
  const cid = String(c.candidate_id || '');
  const ticker = String(c.ticker || cid || '').toUpperCase();
  const canBuy = st === 'pending';
  const processing = st === 'manual_requested';
  const filled = st === 'manual_executed' || st === 'auto_executed';
  const signalPrice = Number(c.price || 0);
  const fillPrice = filled ? _posEntry[ticker] : null;
  const curPrice = _posCurrent[ticker] ?? _candPrice[ticker];
  const chg = changePct(signalPrice, curPrice);
  const chgCls = chg!=null && chg>=0 ? 'univ-pos' : 'univ-neg';
  const chgBadge = chg==null ? '' : `<span class="cand-chg ${chgCls}">${chg>=0?'+':''}${chg.toFixed(2)}%</span>`;
  const sigTxt = signalPrice ? `$${signalPrice.toFixed(2)}` : '-';
  const curTxt = curPrice ? `$${Number(curPrice).toFixed(2)}` : '—';
  const fillTxt = fillPrice ? `$${Number(fillPrice).toFixed(2)}` : '';
  const fillPart = filled ? `체결가 <span class="cand-fill">${htmlEsc(fillTxt || '확인중')}</span>` : '';
  const notional = Number(c.notional || 0).toLocaleString();
  const shares = c.shares != null ? `${c.shares}주` : '';
  const score = c.score != null ? `점수 ${Number(c.score).toFixed(1)}` : '';
  const tail = [notional ? `$${notional}` : '', shares, score].filter(Boolean).join(' · ');
  let btn;
  if(canBuy){
    const busy = _candBusy[cid];
    btn = `<button class="cand-buy${busy?' processing':''}" ${busy?'disabled':''} data-candidate-id="${htmlEsc(cid)}">${busy?'요청 중…':'지금 매수'}</button>`;
  }else if(processing){
    btn = '<button class="cand-buy processing" disabled>처리 중…</button>';
  }else{
    btn = '<button class="cand-buy" disabled>—</button>';
  }
  return `<div class="cand-card" data-cand-ticker="${htmlEsc(ticker)}" data-signal-price="${signalPrice}" data-fill-price="${fillPrice || ''}">
    <div class="cand-info">
      <span class="cand-tkr">${htmlEsc(ticker || cid)} ${chgBadge}</span>
      <span class="cand-sub">신호가 ${htmlEsc(sigTxt)} → 현재 ${htmlEsc(curTxt)}${fillPart ? ' · '+fillPart : ''}${tail ? ' · '+htmlEsc(tail) : ''}</span>
    </div>
    <div class="cand-right">
      <span class="cand-badge ${b.cls}">${b.txt}</span>
      ${btn}
    </div>
  </div>`;
}
async function requestBuy(candidateId){
  if(_candBusy[candidateId]) return;
  _candBusy[candidateId] = true;
  loadCandidates();
  try{
    const r = await fetch(`${API}/api/live/manual_buy_intent`, {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({candidate_id:candidateId, source:'dashboard'})
    });
    if(!r.ok){
      const err = await r.json().catch(()=>({detail:'요청 실패'}));
      toast('매수 요청 거부', err.detail || `HTTP ${r.status}`, 'warn');
    }else{
      toast('매수 요청됨', '다음 tick에서 검증·체결됩니다', 'good');
    }
  }catch(e){
    toast('통신 오류', String(e), 'warn');
  }finally{
    _candBusy[candidateId] = false;
    loadCandidates();
  }
}
async function openCandChart(ticker, signalPrice, fillPrice){
  ticker = String(ticker || '').toUpperCase();
  const signal = Number(signalPrice || 0);
  const fill = Number(fillPrice || 0);
  if(!ticker) return;
  const modal = document.getElementById('cand-modal');
  modal.style.display = 'flex';
  document.getElementById('cm-tkr').textContent = ticker;
  document.getElementById('cm-summary').innerHTML = '<span>불러오는 중…</span>';
  const el = document.getElementById('cm-chart');
  if(_candChart){ _candChart.remove(); _candChart = null; }
  el.innerHTML = '';
  _candChart = LightweightCharts.createChart(el, {
    layout:{background:{color:'#0f141b'}, textColor:'#b8c1cf'},
    grid:{vertLines:{color:'#1a1f28'}, horzLines:{color:'#1a1f28'}},
    timeScale:{timeVisible:true, secondsVisible:false},
    width: Math.max(el.clientWidth, 300), height: 340,
  });
  _candSeries = _candChart.addCandlestickSeries({
    upColor:'#52e09a', downColor:'#e05252',
    borderVisible:false, wickUpColor:'#52e09a', wickDownColor:'#e05252',
  });
  let candles=[];
  try{
    const r = await fetch(`${API}/api/live/candles/${ticker}?interval=15m`);
    candles = await r.json();
  }catch(e){}
  if(!Array.isArray(candles) || !candles.length){
    document.getElementById('cm-summary').innerHTML = '<span>차트 데이터 없음</span>';
    return;
  }
  _candSeries.setData(candles);
  if(signal){
    _candSeries.createPriceLine({
      price: signal, color:'#4a9eff', lineWidth:2,
      lineStyle: (LightweightCharts.LineStyle && LightweightCharts.LineStyle.Dashed) || 2,
      axisLabelVisible:true, title:`신호가 ${signal.toFixed(2)}`,
    });
  }
  if(fill){
    _candSeries.createPriceLine({
      price: fill, color:'#f5c451', lineWidth:2,
      lineStyle: (LightweightCharts.LineStyle && LightweightCharts.LineStyle.Dashed) || 2,
      axisLabelVisible:true, title:`체결가 ${fill.toFixed(2)}`,
    });
  }
  const n = candles.length;
  _candChart.timeScale().setVisibleLogicalRange({from: Math.max(0, n-80), to: n});
  const cur = _posCurrent[ticker] ?? candles[n-1].close;
  const chg = changePct(signal, cur);
  const cls = chg!=null && chg>=0 ? 'univ-pos' : 'univ-neg';
  const chgTxt = chg==null ? '-' : `${chg>=0?'+':''}${chg.toFixed(2)}%`;
  const fillSummary = fill ? `<div><div class="cand-sub">체결가</div><div class="big cand-fill">$${fill.toFixed(2)}</div></div>` : '';
  document.getElementById('cm-summary').innerHTML = `
    <div><div class="cand-sub">신호가</div><div class="big">${signal ? '$'+signal.toFixed(2) : '—'}</div></div>
    ${fillSummary}
    <div><div class="cand-sub">현재가</div><div class="big">$${Number(cur).toFixed(2)}</div></div>
    <div><div class="cand-sub">신호가 대비</div><div class="big ${cls}">${chgTxt}</div></div>`;
}
function closeCandChart(){
  document.getElementById('cand-modal').style.display = 'none';
  if(_candChart){ _candChart.remove(); _candChart = null; }
}

function slotCard(s,onclick){
  if(s.empty) return `<div class="mslot empty">슬롯 ${s.slot}<br>비어있음</div>`;

  const invested = (s.entry_price || 0) * (s.shares || 0);
  const investedTxt = invested
    ? `$${invested.toLocaleString(undefined,{maximumFractionDigits:0})}`
    : '-';

  const fmtP = v => v == null || !isFinite(v)
    ? '-'
    : `${v >= 0 ? '+' : ''}${v.toFixed(2)}%`;

  const stopPct = s.stop_price && s.entry_price
    ? (s.stop_price / s.entry_price - 1) * 100
    : null;

  const targetPct = s.target_price && s.entry_price
    ? (s.target_price / s.entry_price - 1) * 100
    : null;

  const trailPct = s.trailing_stop && s.entry_price
    ? (s.trailing_stop / s.entry_price - 1) * 100
    : null;

  // 손절(0%) ~ 목표(100%) 사이에서 현재가 위치 계산
  let gauge='';
  if(s.stop_price!=null && s.target_price!=null && s.current_price!=null
     && s.target_price>s.stop_price){
    let p=(s.current_price - s.stop_price)/(s.target_price - s.stop_price)*100;
    p=Math.max(0,Math.min(100,p));
    gauge=`<div class="gauge">
      <div class="gauge-bar"><div class="gauge-mark" style="left:${p}%"></div></div>
      <div class="gauge-labels">
        <span>손절 ${fmtP(stopPct)}</span>
        <span>익절 ${fmtP(targetPct)}</span>
      </div>
    </div>`;
  }

  return `<div class="mslot" onclick="${onclick}('${s.ticker}')">
    <div class="mslot-top"><span class="mslot-tk">${s.ticker}</span>
      <span class="mslot-pnl" style="color:${col(s.pnl_pct)}">${pct(s.pnl_pct)}</span></div>
    <div class="mslot-sub">현재 ${fmt(s.current_price)} · 진입 ${fmt(s.entry_price)} · 투입 ${investedTxt}</div>
    ${gauge}
    <div class="mslot-sub" style="margin-top:7px;">
      <span class="tag">${s.exit_strategy||'?'}</span> ${s.direction||''} · 최대 ${s.max_holding_days}일 · 트레일 ${fmtP(trailPct)}
    </div>
  </div>`;
}

async function drawChart(ticker, interval){
  curTicker=ticker; curInterval=interval;
  const intraday = !['1d','1wk','1mo'].includes(interval);
  chart.applyOptions({ timeScale:{ timeVisible:intraday, secondsVisible:false, borderColor:'#1c2535' } });
  let candles=[];
  try{ candles=await (await fetch(`${API}/api/live/candles/${ticker}?interval=${interval}`)).json(); }catch(e){}
  series.setData(candles);
  // 거래량 막대 (오른날 초록/내린날 빨강)
  volSeries.setData(candles.map(c=>({
    time:c.time, value:c.volume||0,
    color: c.close>=c.open ? 'rgba(38,208,124,.5)' : 'rgba(255,77,106,.5)'
  })));
  const s=slotData.find(x=>x.ticker===ticker);
  // 진입 마커 (일봉일 때만 날짜 매칭이 정확)
  series.setMarkers([]);
  if(s && s.entry_date && !intraday){
    const entryDay=s.entry_date.slice(0,10);
    // 진입일 이후 첫 캔들에 마커 (정확히 같은 날 없으면 가장 가까운 이후 날짜)
    const hit=candles.find(c=>c.time>=entryDay);
    if(hit){
      series.setMarkers([{
        time:hit.time, position:'belowBar', color:'#3b82f6', shape:'arrowUp',
        text:`진입 ${fmt(s.entry_price)}`,
      }]);
    }
  }
  priceLines.forEach(l=>series.removePriceLine(l)); priceLines=[];
  if(s){
    [['진입',s.entry_price,'#3b82f6'],['목표',s.target_price,'#26d07c'],
     ['손절',s.stop_price,'#ff4d6a'],['트레일',s.trailing_stop,'#f5c451'],
     ['현재',s.current_price,'#c9d4e5']].forEach(([t,p,c])=>{
      if(p==null) return;
      priceLines.push(series.createPriceLine({price:p,color:c,lineWidth:t==='현재'?2:1,
        lineStyle:t==='현재'?0:2,axisLabelVisible:true,title:t}));
    });
  }
  if(candles.length){
    chart.resize(document.getElementById('chart').clientWidth, 440);
    // 간격별로 보여줄 최근 캔들 개수 (없으면 전체)
    const visibleBars = {'1m':80, '5m':80, '15m':70, '60m':60, '1d':120};
    const n = visibleBars[interval];
    if(n && candles.length > n){
      chart.timeScale().setVisibleLogicalRange({ from: candles.length - n, to: candles.length + 2 });
    }else{
      chart.timeScale().fitContent();
    }
  }
}

  event_response_rate_hike:"금리 인상 대응", event_response_rate_cut:"금리 인하 대응",
  event_response_fed_statement:"연준 성명 대응", event_response_inflation:"물가 대응",
  event_response_war:"전쟁 대응", event_response_geopolitical:"지정학 리스크 대응",
  event_response_tariff:"관세 대응",
};

function rbVal(v){
  if(v===true) return '✓'; if(v===false) return '✗';
  if(v==null) return '—';
  if(typeof v==='number') return Number.isInteger(v)?v:v.toFixed(3);
  return v;
}
function rbSection(title, rb, keys){
  let body=keys.filter(k=>rb[k]!==undefined)
    .map(k=>`<div class="rb-kv"><span>${RB_LABELS[k]||k}</span><span>${rbVal(rb[k])}</span></div>`).join('');
  if(!body) body='<div class="rb-kv"><span>—</span><span></span></div>';
  return `<div class="rb-sec"><div class="rb-sec-h" onclick="this.parentElement.classList.toggle('open')">
    <span>${title}</span><span class="rb-arrow">▶</span></div>
    <div class="rb-sec-b">${body}</div></div>`;
}
function daysBetween(iso){
  if(!iso) return null;
  try{ return Math.floor((Date.now()-new Date(iso).getTime())/86400000); }catch(e){ return null; }
}
function renderCommentary(s){
  const e=s.entry||{}, rb=s.rulebook||{};
  // 진입 당시 기록
  const entryGrid=`<div class="cmt-grid">
    <div class="cmt-item"><div class="v">${e.market_score??'—'}</div><div class="l">시장점수</div></div>
    <div class="cmt-item"><div class="v">${e.sector_score??'—'}</div><div class="l">섹터점수</div></div>
    <div class="cmt-item"><div class="v">${e.vix!=null?Number(e.vix).toFixed(1):'—'}</div><div class="l">VIX</div></div>
    <div class="cmt-item"><div class="v" style="color:var(--up)">${e.win_rate??'—'}%</div><div class="l">진입승률</div></div>
  </div>`;
  // 현재 진단 계산
  let parts=[];
  // 손절~목표 진행률
  if(s.stop_price!=null && s.target_price!=null && s.current_price!=null && s.target_price>s.stop_price){
    let prog=(s.current_price-s.stop_price)/(s.target_price-s.stop_price)*100;
    prog=Math.max(0,Math.min(100,prog));
    let pill = prog<=15 ? '<span class="pill pill-warn">손절 근접</span>'
             : prog>=85 ? '<span class="pill pill-ok">목표 근접</span>'
             : '<span class="pill pill-neutral">중립 구간</span>';
    parts.push(`${pill} 손절~목표 구간에서 현재 <b>${prog.toFixed(0)}%</b> 지점`);
  }
  // 손익
  if(s.pnl_pct!=null){
    const c=s.pnl_pct>=0?'var(--up)':'var(--down)';
    parts.push(`평가손익 <b style="color:${c}">${pct(s.pnl_pct)}</b>`);
  }
  // 보유일
  const held=daysBetween(s.entry_date);
  if(held!=null && s.max_holding_days){
    const near = held>=s.max_holding_days*0.8;
    parts.push(`보유 <b>${held}일</b> / 최대 ${s.max_holding_days}일${near?' <span class="pill pill-warn">기간 임박</span>':''}`);
  }
  // 브레이크이븐
  if(rb.breakeven_enabled && s.pnl_pct!=null && rb.breakeven_trigger_profit_pct!=null){
    const reached=s.pnl_pct>=rb.breakeven_trigger_profit_pct;
    parts.push(`본전보호(브레이크이븐) ${reached?'<span class="pill pill-ok">도달</span>':`미도달 (트리거 +${rb.breakeven_trigger_profit_pct}%)`}`);
  }
  // sell_omen
  if(rb.sell_omen_enabled){
    parts.push(`매도신호(sell_omen) 감시 <span class="pill pill-neutral">활성</span>`);
  }
  const status=`<div class="cmt-status">${parts.join('<br>')}</div>`;
  const note=`<div class="cmt-note">※ 명시적 진입 사유 로그는 없습니다. 위 내용은 진입 당시 기록값과 현재 룰북 기준에 따른 진단이며, 봇의 실제 판단과 다를 수 있습니다.</div>`;
  return `<div class="cmt-block"><div class="cmt-h">진입 당시 기록 (${(s.entry_date||'').slice(0,16).replace('T',' ')})</div>${entryGrid}</div>
          <div class="cmt-block"><div class="cmt-h">현재 진단</div>${status}</div>${note}`;
}
function renderRulebook(s){
  const rb=s.rulebook||{};
  const stats=`<div class="rb-stats">
    <div class="rb-stat"><div class="v" style="color:var(--up)">${rbVal(rb.win_rate)}%</div><div class="l">승률</div></div>
    <div class="rb-stat"><div class="v">${rbVal(rb.fitness)}</div><div class="l">Fitness</div></div>
    <div class="rb-stat"><div class="v" style="color:${(rb.expectancy_pct||0)>=0?'var(--up)':'var(--down)'}">${rbVal(rb.expectancy_pct)}</div><div class="l">기대값%</div></div>
    <div class="rb-stat"><div class="v">${rbVal(rb.avg_return_pct)}</div><div class="l">평균수익%</div></div>
    <div class="rb-stat"><div class="v" style="color:var(--down)">${rbVal(rb.max_drawdown_pct)}</div><div class="l">MDD%</div></div>
    <div class="rb-stat"><div class="v">${rbVal(rb.trade_count)}</div><div class="l">거래수</div></div>
  </div>`;
  const strat=rbSection('⚙️ 전략 / 진입', rb,
    ['direction','exit_strategy','signal_threshold','signal_multiplier','rsi_low','rsi_high',
     'macd_min_hist','bb_proximity','volume_surge_ratio','position_sizing_strategy','base_position_ratio']);
  const risk=rbSection('🛡️ 리스크 / 청산', rb,
    ['max_holding_days','stop_loss_atr','stop_loss_atr_bear','take_profit_atr','take_profit_atr_bull',
     'trailing_atr','trailing_atr_volatile','trailing_activation_profit_pct',
     'breakeven_enabled','breakeven_trigger_profit_pct','breakeven_floor_profit_pct',
     'add_buy_enabled','add_buy_max_count','add_buy_trigger_profit_pct']);
  const news=rbSection('📰 뉴스 / 시장 / 섹터', rb,
    ['sector_name','use_news_global','news_block_cap','use_market_entry_adjustment',
     'market_score_weight','market_adjustment_strength','sector_strength_weight',
     'sell_omen_enabled','sell_omen_threshold','crash_buy_enabled']);
  const event=rbSection('⚡ 이벤트 반응', rb,
    ['event_response_rate_hike','event_response_rate_cut','event_response_fed_statement',
     'event_response_inflation','event_response_war','event_response_geopolitical','event_response_tariff']);
  return stats + strat + risk + news + event;
}

async function openDetail(ticker){
  // 슬롯 탭으로 전환 + 상세뷰 표시
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
  document.getElementById('page-slots').classList.add('active');
  document.querySelectorAll('.nav button').forEach(b=>b.classList.remove('active'));
  document.querySelectorAll('.nav button')[1].classList.add('active');
  document.getElementById('slot-list-view').style.display='none';
  document.getElementById('slot-detail-view').style.display='block';
  chart.resize(document.getElementById('chart').clientWidth, 440);

  const s=slotData.find(x=>x.ticker===ticker); if(!s) return;
  document.getElementById('detail-title').textContent=`${ticker} — 보유 차트`;
  // 캔들 (간격 버튼은 일봉으로 리셋)
  document.querySelectorAll('.tf').forEach(b=>b.classList.toggle('active', b.dataset.tf==='1d'));
  await drawChart(ticker, '1d');
  // 룰북/포지션 표
  document.getElementById('detail-kv').innerHTML=`
    <div class="kv"><span>현재가</span><span>${fmt(s.current_price)}</span></div>
    <div class="kv"><span>손익률</span><span style="color:${col(s.pnl_pct)}">${pct(s.pnl_pct)}</span></div>
    <div class="kv"><span>진입가</span><span>${fmt(s.entry_price)}</span></div>
    <div class="kv"><span>목표가</span><span style="color:var(--up)">${fmt(s.target_price)}</span></div>
    <div class="kv"><span>손절가</span><span style="color:var(--down)">${fmt(s.stop_price)}</span></div>
    <div class="kv"><span>트레일링</span><span style="color:var(--gold)">${fmt(s.trailing_stop)}</span></div>
    <div class="kv"><span>수량</span><span>${fmt(s.shares,4)}</span></div>
    <div class="kv"><span>방향</span><span>${s.direction||'—'}</span></div>
    <div class="kv"><span>청산 전략</span><span>${s.exit_strategy||'—'}</span></div>
    <div class="kv"><span>최대 보유</span><span>${s.max_holding_days}일</span></div>
    <div class="kv"><span>진입일</span><span>${(s.entry_date||'').slice(0,10)}</span></div>`;
  document.getElementById('detail-kv').innerHTML += renderRulebook(s);
  document.getElementById('commentary').innerHTML = renderCommentary(s);
}
function closeDetail(){
  document.getElementById('slot-detail-view').style.display='none';
  document.getElementById('slot-list-view').style.display='block';
}

// ===== 시장 / 뉴스 =====
async function loadMarket(){
  try{ marketData=await (await fetch(`${API}/api/live/market`)).json(); }catch(e){ return; }
  const m=marketData, rb=m.regime==='bull'?'bull':'bear';
  document.getElementById('regime').innerHTML=
    `<span class="dot"></span> <span class="badge ${rb}">${m.regime||'?'}</span>
     점수 ${m.score??'?'} · VIX ${m.vix_level??'?'}`;
  // 이벤트 요약 (홈)
  let ev='';
  (m.risk_events||[]).forEach(e=>ev+=`<div class="ev" onclick="document.querySelectorAll('.nav button')[2].click()"><span class="ev-risk">▼</span> ${e}</div>`);
  (m.benefit_events||[]).forEach(e=>ev+=`<div class="ev" onclick="document.querySelectorAll('.nav button')[2].click()"><span class="ev-benefit">▲</span> ${e}</div>`);
  document.getElementById('home-events').innerHTML=ev||'<div class="loading">이벤트 없음</div>';
  // 섹터
  const sec=m.sector_strength||{};
  document.getElementById('home-sectors').innerHTML=Object.entries(sec).map(([k,v])=>
    `<div class="sector"><span>${k}</span><span>${v}</span></div><div class="bar"><div style="width:${v}%"></div></div>`).join('')||'—';
  // 뉴스 페이지 상세
  const act=m.active_events||{};
  let detail='';
  Object.entries(act).forEach(([name,d])=>{
    const arts=(d.articles||[]).map(a=>`<div class="nt">· ${a.title||''} ${a.url?`<a href="${a.url}" target="_blank">[링크]</a>`:''}</div>`).join('');
    const ic=d.market_impact==='악재'?'var(--down)':'var(--up)';
    detail+=`<div class="news-card"><b style="color:${ic}">${name}</b>
      <span class="nt">(${d.market_impact||''}, 영향도 ${d.total_impact_score})</span>${arts}</div>`;
  });
  document.getElementById('news-events').innerHTML=detail||'<div class="loading">활성 이벤트 없음</div>';
}

async function loadNews(){
  let n; try{ n=await (await fetch(`${API}/api/live/news`)).json(); }catch(e){ return; }
  const sent=(n.sentiment||{}).entries||{};
  const rows=Object.values(sent).map(e=>
    `<div class="kv"><span>${e.ticker}</span>
     <span style="color:${e.score>=0?'var(--up)':'var(--down)'}">${fmt(e.score,3)} <small style="color:var(--dim)">(${e.article_count||0}건)</small></span></div>`).join('');
  document.getElementById('news-sentiment').innerHTML=rows||'<div class="loading">데이터 없음</div>';
}

document.querySelectorAll('.tf').forEach(btn=>{

}

document.addEventListener('fullscreenchange', ()=>{
  const b=document.getElementById('fs-btn');
  if(b) b.textContent = document.fullscreenElement ? '🗗' : '⛶';

function updateClock(){
  const now=new Date();
  // 현재 시각 (브라우저 로컬, 보통 한국시간)
  document.getElementById('clock').textContent =
    now.toLocaleTimeString('ko-KR',{hour12:false});

  // 미국 동부시간 구하기 (서머타임 자동 반영)
  const etStr = now.toLocaleString('en-US',{timeZone:'America/New_York'});
  const et = new Date(etStr);
  const day = et.getDay();          // 0=일,6=토
  const mins = et.getHours()*60 + et.getMinutes();
  const open = 9*60+30;             // 09:30
  const close = 16*60;              // 16:00
  const el = document.getElementById('market-status');

  const fmtDur = m=>{
    const h=Math.floor(m/60), mm=m%60;
    return (h>0?`${h}시간 `:'')+`${mm}분`;
  };

  if(day===0 || day===6){
    el.innerHTML = `🇺🇸 미국장 <span style="color:var(--dim)">주말 휴장</span>`;
    return;
  }
  if(mins < open){
    el.innerHTML = `🇺🇸 미국장 <span style="color:var(--gold)">개장 ${fmtDur(open-mins)} 전</span>`;
  }else if(mins < close){
    el.innerHTML = `🇺🇸 미국장 <span style="color:var(--up)">열림</span> · 마감 ${fmtDur(close-mins)} 전`;
  }else{
    // 다음 개장까지 (다음 영업일 09:30)
    const toMidnight = 24*60 - mins;
    let toOpen = toMidnight + open;
    el.innerHTML = `🇺🇸 미국장 <span style="color:var(--down)">마감</span> · 개장 ${fmtDur(toOpen)} 전`;
  }
}
setInterval(updateClock, 1000);
updateClock();

  loadAccount(); loadSlots(); loadMarket(); loadNews(); loadEquityCurve(); loadHistory(); loadCandidates();

}
