<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KINGMAKER Elite Strategy Sim</title>
<style>
:root{--bg:#0a0e17;--panel:#111722;--panel2:#0d121c;--line:#1c2535;--txt:#c9d4e5;--dim:#6f7d92;--up:#26d07c;--down:#ff4d6a;--accent:#3b82f6;--gold:#f5c451}*{box-sizing:border-box;margin:0;padding:0}body{background:var(--bg);color:var(--txt);font-family:"Segoe UI","Malgun Gothic",sans-serif;font-size:12px}.topbar{height:48px;display:flex;justify-content:space-between;align-items:center;padding:0 18px;border-bottom:1px solid var(--line);background:#0d121c;position:sticky;top:0;z-index:5}.logo{font-size:16px;font-weight:900;letter-spacing:1px}.logo span{color:var(--gold)}.nav{display:flex;gap:7px}.btn{border:1px solid var(--line);background:var(--panel2);color:var(--txt);border-radius:7px;padding:6px 10px;font-weight:800;cursor:pointer;text-decoration:none;font-size:12px}.btn:hover{border-color:var(--accent)}.page{padding:12px 14px}.note{border:1px solid #2b3445;background:#0d121c;color:#9aa8bd;border-radius:9px;padding:8px 10px;margin-bottom:10px;line-height:1.35}.strategy{background:var(--panel);border:1px solid var(--line);border-radius:12px;margin-bottom:14px;overflow:hidden}.strategy-head{display:flex;justify-content:space-between;gap:12px;align-items:center;padding:10px 12px;background:#0d121c;border-bottom:1px solid var(--line)}.strategy-head h2{font-size:15px}.strategy-head .right{color:var(--dim);font-size:11px;text-align:right}.badge{display:inline-flex;align-items:center;border-radius:999px;padding:2px 7px;font-weight:900;font-size:10px;background:rgba(59,130,246,.16);color:#bfdbfe;white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis}.summary{display:grid;grid-template-columns:repeat(7,minmax(95px,1fr));gap:1px;background:var(--line);border-bottom:1px solid var(--line)}.metric{background:var(--panel2);padding:8px 10px;min-height:50px;min-width:0;overflow:hidden}.lab{font-size:10px;color:var(--dim);letter-spacing:.5px;text-transform:uppercase}.val{font-size:16px;font-weight:900;margin-top:3px;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.sub{font-size:10px;color:var(--dim);margin-top:2px;min-width:0;overflow:hidden}.pos{color:var(--up);font-weight:800}.neg{color:var(--down);font-weight:800}.chip{display:inline-flex;gap:4px;align-items:center;border:1px solid var(--line);background:rgba(255,255,255,.03);border-radius:999px;padding:3px 7px;color:#c9d4e5;font-size:11px;line-height:1;max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.chip b{color:#fff;font-variant-numeric:tabular-nums}.chip.buy,.chip.rebound{border-color:rgba(38,208,124,.35);background:rgba(38,208,124,.08)}.chip.wait,.chip.base{border-color:rgba(245,196,81,.35);background:rgba(245,196,81,.08)}.chip.no,.chip.drop{border-color:rgba(255,77,106,.35);background:rgba(255,77,106,.08)}.chip.info{border-color:rgba(59,130,246,.35);background:rgba(59,130,246,.08)}.table-wrap{width:100%;overflow-x:auto;overflow-y:visible}.row{display:grid;grid-template-columns:82px 104px 145px 66px 80px 78px 90px 104px minmax(170px,1fr);gap:8px;align-items:center;padding:7px 10px;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums;min-width:960px;width:max(100%,960px);position:relative}.row>*{min-width:0;max-width:100%;overflow:hidden;text-overflow:ellipsis}.row:hover{background:rgba(255,255,255,.025)}.head{position:relative;top:auto;z-index:1;color:var(--dim);font-size:10px;text-transform:uppercase;font-weight:900;background:#080d15;border-top:1px solid var(--line);border-bottom:2px solid var(--line);box-shadow:none}.tk{display:flex;align-items:center;gap:4px;font-size:14px;font-weight:900;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.tk .sym{min-width:0;overflow:hidden;text-overflow:ellipsis}.tk .badge{flex:0 0 auto}.gate{background:rgba(245,196,81,.14);color:var(--gold)}.forecast{display:flex;gap:5px;align-items:center;min-width:0;max-width:100%;white-space:nowrap;overflow:hidden}.forecast .main{font-weight:900;min-width:0;overflow:hidden;text-overflow:ellipsis}.forecast .prob{font-size:10px;color:var(--dim);flex:0 0 auto}.forecast.rebound .main{color:var(--up)}.forecast.base .main{color:var(--gold)}.forecast.drop .main{color:var(--down)}.forecast.info .main{color:#bfdbfe}.pricepair{display:flex;flex-direction:column;gap:2px;min-width:0;overflow:hidden}.pricepair span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.hist{font-size:11px;color:#9aa8bd;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.closed{border-top:1px solid var(--line);padding:8px 10px;color:var(--dim);font-size:11px}.loading{padding:22px;text-align:center;color:var(--dim)}@media(max-width:1050px){.summary{grid-template-columns:repeat(3,1fr)}.strategy-head{align-items:flex-start;flex-direction:column}.strategy-head .right{text-align:left}}@media(max-width:640px){.topbar{height:auto;align-items:flex-start;gap:8px;flex-direction:column;padding:8px 12px}.nav{flex-wrap:wrap}.page{padding:10px}.summary{grid-template-columns:repeat(2,1fr)}.row{min-width:900px;width:900px;grid-template-columns:76px 96px 136px 62px 76px 74px 86px 98px 160px}}
</style>
</head>
<body>
<div class="topbar">
  <div class="logo">KINGMAKER <span>GATE STRATEGY SIM</span></div>
  <div class="nav">
    <a class="btn" href="/elite-shadow">Elite Shadow</a>
    <button class="btn" onclick="manualTick()">전략 Tick</button>
    <button class="btn" onclick="load()">새로고침</button>
  </div>
</div>
<div class="page">
  <div class="note">실제 주문 없는 모의전략. 10초마다 가격/손익 갱신. 눌림 예후는 과거 동일 룰북의 MAE/MFE/목표가 도달 패턴과 현재 신호 유지율 비교.</div>
  <div id="root"><div class="loading">로딩...</div></div>
</div>
<script>
let DATA=null;
const REFRESH_MS=10000;
const fmt=(n,d=2)=>n==null||!isFinite(Number(n))?'—':Number(n).toFixed(d);
const pct=n=>n==null||!isFinite(Number(n))?'—':(Number(n)>=0?'+':'')+Number(n).toFixed(2)+'%';
const usd=n=>n==null||!isFinite(Number(n))?'—':(Number(n)>=0?'+':'-')+'$'+Math.abs(Number(n)).toLocaleString(undefined,{maximumFractionDigits:2});
const cls=n=>Number(n)>=0?'pos':'neg';
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function safe(n){const v=Number(n);return isFinite(v)?v:0}
function compactUsd(n){if(n==null||!isFinite(Number(n)))return'—';let v=Number(n),a=Math.abs(v);let s=a>=1000000?(a/1000000).toFixed(1)+'M':a>=1000?(a/1000).toFixed(1)+'k':a.toFixed(0);return(v>=0?'+':'-')+'$'+s}
function stage(s){return String(s||'').replace('stage','S').toUpperCase()}
function shortGate(g){return String(g||'').replace('BUY_PULLBACK_REENTRY','PULLBACK').replace('BUY_FRESH','FRESH').replace('BUY_NORMAL','NORMAL').replace('WAIT_PULLBACK_CONFIRM','WAIT_PB')}
function gateClass(k){k=String(k||'');if(k.startsWith('BUY')||k==='REBOUND_TO_TARGET')return'buy rebound';if(k.startsWith('WAIT')||k==='BASE_HOLD')return'wait base';if(k.startsWith('NO_BUY')||k==='DROP_MORE')return'no drop';return'info'}
function chipLabel(k){return String(k||'UNKNOWN').replace('BUY_PULLBACK_REENTRY','PULLBACK').replace('WAIT_OLD_SIGNAL_NEEDS_RESET','WAIT_OLD').replace('NO_BUY_LATE_CHASE','NO_CHASE').replace('NO_BUY_SIGNAL_FAILING','NO_FAIL').replace('NO_BUY_NO_CURRENT_SIGNAL','NO_SIGNAL').replace('REBOUND_TO_TARGET','반등').replace('BASE_HOLD','횡보').replace('DROP_MORE','하락').replace('INSUFFICIENT_HISTORY','기록부족').replace('not_buy_signal','NO_SIG').replace('already_open','OPEN')}
function forecastClass(k){k=String(k||'');if(k==='REBOUND_TO_TARGET')return'rebound';if(k==='BASE_HOLD')return'base';if(k==='DROP_MORE')return'drop';return'info'}
function renderChips(obj,max=6){obj=obj||{};let items=Object.entries(obj).filter(([k,v])=>Number(v)>0).sort((a,b)=>Number(b[1])-Number(a[1])).slice(0,max);return items.length?items.map(([k,v])=>`<span class="chip ${gateClass(k)}"><span>${esc(chipLabel(k))}</span><b>${v}</b></span>`).join(''):'<span class="chip info"><span>없음</span><b>0</b></span>'}
function forecastText(f){f=f||{};if(!f.label||f.label==='NOT_PULLBACK_SCOPE')return '<div class="forecast info"><span class="main">—</span><span class="prob">눌림아님</span></div>';let p=f.probabilities||{};let c=forecastClass(f.label);let main=f.display||chipLabel(f.label);let prob=f.confidence_pct!=null?fmt(f.confidence_pct,0)+'%':'—';let detail=`R${fmt(p.REBOUND_TO_TARGET,0)} B${fmt(p.BASE_HOLD,0)} D${fmt(p.DROP_MORE,0)}`;return `<div class="forecast ${c}" title="${esc((f.reasons||[]).join(' | '))}"><span class="main">${esc(main)} ${prob}</span><span class="prob">${esc(detail)}</span></div>`}
function historyText(h){h=h||{};let r=h.ratio_retention;return `${h.consecutive_buy_days||0}일 · 첫BUY ${pct(h.proposed_vs_first_buy_pct)} · 유지 ${r==null?'—':fmt(r*100,0)+'%'}`}
function targetStop(p){let last=safe(p.last_price),t=safe(p.target_price),s=safe(p.stop_price);let up=last&&t?(t/last-1)*100:null;let dn=last&&s?(last/s-1)*100:null;return `<span class="pos">T ${pct(up)}</span><span class="neg">S -${fmt(dn)}%</span>`}
async function load(){const r=await fetch('/api/live/elite_strategy_sim?ts='+Date.now(),{cache:'no-store'});DATA=await r.json();render()}
async function manualTick(){document.getElementById('root').innerHTML='<div class="loading">전략 tick 실행 중...</div>';await fetch('/api/live/elite_strategy_sim_tick?max_candidates=93&ts='+Date.now(),{method:'POST',cache:'no-store'}).then(r=>r.json()).catch(()=>null);await load()}
function render(){const st=(DATA&&DATA.strategies)||{};document.getElementById('root').innerHTML=['final_gate','pullback_only'].map(name=>renderStrategy(name,st[name]||{})).join('')}
function renderStrategy(name,sim){
  const s=sim.summary||{},lt=sim.last_tick||{},pr=sim.price_refresh||{},pf=sim.pullback_forecast_summary||{};
  const opens=(sim.open_positions||[]).slice().sort((a,b)=>safe(b.unrealized_pnl_pct)-safe(a.unrealized_pnl_pct));
  const trades=sim.recent_trades||[];
  const title=name==='final_gate'?'최종 게이트':'눌림 전용';
  const priceSub=pr.refreshed_at?`가격 ${pr.refreshed}/${pr.open_count} · ${pr.refreshed_at}`:'가격 갱신 대기';
  return `<section class="strategy"><div class="strategy-head"><h2>${title} <span class="badge">${esc(name)}</span></h2><div class="right">${lt.time?`tick ${lt.time} · 평가 ${lt.evaluated||0} · 신규 ${lt.opened||0} · 청산 ${lt.closed||0}`:'아직 tick 없음'}<br>${esc(priceSub)}</div></div><div class="summary"><div class="metric"><div class="lab">총손익</div><div class="val ${cls(s.total_pnl_usd)}">${compactUsd(s.total_pnl_usd)}</div><div class="sub ${cls(s.total_roi_pct)}">${pct(s.total_roi_pct)}</div></div><div class="metric"><div class="lab">보유</div><div class="val">${s.open_count||0}</div><div class="sub ${cls(s.open_roi_pct)}">ROI ${pct(s.open_roi_pct)}</div></div><div class="metric"><div class="lab">투입</div><div class="val">${compactUsd(s.total_notional).replace('+','')}</div><div class="sub">보유 ${compactUsd(s.open_notional).replace('+','')}</div></div><div class="metric"><div class="lab">청산</div><div class="val">${s.closed_count||0}</div><div class="sub">승률 ${fmt(s.win_rate,1)}%</div></div><div class="metric"><div class="lab">눌림 예후</div><div class="val">${pf.ok_count||0}/${pf.scoped_positions||0}</div><div class="sub">${renderChips(pf.counts||{},3)}</div></div><div class="metric"><div class="lab">Gate</div><div class="sub">${renderChips(sim.open_gate_counts||{},4)}</div></div><div class="metric"><div class="lab">Skip</div><div class="sub">${renderChips((lt.skipped||{}),4)}</div></div></div><div class="table-wrap"><div class="row head"><span>종목</span><span>Gate</span><span>눌림 예후</span><span>손익률</span><span>손익$</span><span>현재가</span><span>목표/손절</span><span>진입/보유</span><span>신호 히스토리</span></div>${opens.length?opens.map(p=>`<div class="row"><span class="tk"><span class="sym">${esc(p.ticker)}</span><span class="badge">${stage(p.stage)}</span></span><span><span class="badge gate">${esc(shortGate(p.gate))}</span></span><span>${forecastText(p.pullback_forecast)}</span><span class="${cls(p.unrealized_pnl_pct)}">${pct(p.unrealized_pnl_pct)}</span><span class="${cls(p.unrealized_pnl_usd)}">${usd(p.unrealized_pnl_usd)}</span><span>${fmt(p.last_price)}</span><span class="pricepair">${targetStop(p)}</span><span class="pricepair"><span>${fmt(p.entry_price)}</span><span class="sub">${p.holding_days||0}일 · ${usd(p.notional)}</span></span><span class="hist" title="${esc(historyText(p.signal_history))}">${esc(historyText(p.signal_history))}</span></div>`).join(''):'<div class="loading">가상 보유 없음</div>'}</div><div class="closed">청산 거래 ${trades.length}개 ${trades.length?'· 최근 '+esc((trades[0]||{}).ticker||'')+' '+pct((trades[0]||{}).pnl_pct):''}</div></section>`
}
load().catch(e=>{document.getElementById('root').innerHTML='<div class="loading">로드 실패: '+esc(e)+'</div>'});
setInterval(()=>load().catch(()=>null),REFRESH_MS);
</script>
</body>
</html>
