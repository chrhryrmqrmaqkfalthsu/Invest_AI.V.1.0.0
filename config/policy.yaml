# ============================================================
# 트레이딩 엔진 운영 정책
# 미국 주식 전용: 금액 단위는 USD notional로 통일
# ============================================================

mode: paper

live:
  # 라이브 current-context의 direct Event 가산 스위치.
  # 기본값 ON으로 기존 실전·페이퍼·가상 평가 동작을 그대로 유지한다.
  direct_event_enabled: false
  # v3·BOIL 정적 게이트. SHADOW는 판정만 기록하고 후보를 차단하지 않는다.
  integrated_gate_enforcement: SHADOW

cycle:
  interval_seconds: 60
  max_symbols: 10
  market_context_cache_min: 60

capital:
  reserve_pct: 10
  insufficient_threshold_notional: 50
  insufficient_threshold_krw: 50       # legacy field name; USD notional in US-only mode

small_amount_safety:
  enabled: true
  max_shares_per_order: 0
  max_notional_ratio: 0.25             # 계좌 총자본 대비 주문당 상한 비율. SafetyLayer 최종 방어선, 수정 금지.
  order_notional_safety_buffer: 0.003  # cap-bound 주문 sizing 전용 버퍼. 기본 0.3%, 상한 0.5% 권장.
  max_bought_notional_per_day: 0
  max_total_exposure_notional: 0
  max_total_notional: 0
  max_daily_bought_notional: 0
  max_total_invested_krw: 0            # legacy field name; USD notional in US-only mode
  max_orders_per_day: 1000000
  require_first_order_approval: false
  daily_loss_limit_notional: 0         # 0 이하는 일일 실현손실 kill 제한 비활성
  daily_loss_limit_usd: 0              # 0 이하는 일일 실현손실 kill 제한 비활성

risk:
  daily_loss_limit_pct: 0              # 0 이하는 일일 손실률 kill 제한 비활성
  position_limit_pct: 30
  total_exposure_pct: 80
  consecutive_loss_limit: 3
  cooldown_after_consecutive_loss_hours: 24
  market_score_min_for_buy: 30
  block_buy_on_negative_expectancy: true

entry:
  min_expectancy_pct: 0.0
  min_profit_loss_ratio: 1.3
  cooldown_after_buy_hours: 0          # 청산 후 같은 날 같은 ticker 재진입 허용. 보유 중 중복 진입은 one_position_per_symbol로 계속 차단.
  one_position_per_symbol: true
  cooldown_after_loss_hours: 24
  cooldown_after_win_hours: 2

add_buy:
  enabled: true
  max_total_per_symbol_pct: 30
  block_when_losing: true
  min_cooldown_minutes: 30

exit:
  default_max_holding_days: 20
  hard_stop_loss_pct: 5
  force_close_on_kill: true

commission:
  buy_rate: 0.00015
  sell_rate: 0.00015
  slippage_rate: 0.0002
  round_trip_rate: 0.0005

learning:
  generations: 25
  population: 40
  elite_ratio: 0.2
  mutation_rate: 0.15
  seed_pattern_ratio: 0.33
  holding_days_default: 20
  data_years: 5

safety:
  kill_switch: true
  paper_first_days: 0
  initial_manual_approval: true
  max_api_errors_per_hour: 5

notifications:
  send_on_buy: true
  send_on_sell: true
  send_daily_report_at: "22:00"
  timezone: "Asia/Seoul"
  send_weekly_report_day: "sunday"
  send_errors: true

backup:
  enabled: true
  daily_at: "03:00"
  retention_days: 30
  log_rotation_days: 30
