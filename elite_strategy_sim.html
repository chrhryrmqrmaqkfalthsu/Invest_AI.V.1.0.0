<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KINGMAKER Elite Strategy Sim</title>
<style>
:root{--bg:#0a0e17;--panel:#111722;--panel2:#0d121c;--line:#1c2535;--txt:#c9d4e5;--dim:#6f7d92;--up:#26d07c;--down:#ff4d6a;--accent:#3b82f6;--gold:#f5c451;--purple:#8b5cf6}*{box-sizing:border-box;margin:0;padding:0}body{background:var(--bg);color:var(--txt);font-family:"Segoe UI","Malgun Gothic",sans-serif;font-size:13px}.topbar{display:flex;justify-content:space-between;align-items:center;padding:13px 22px;border-bottom:1px solid var(--line);background:linear-gradient(90deg,#0d121c,#111722)}.logo{font-size:18px;font-weight:900;letter-spacing:1.5px}.logo span{color:var(--gold)}.nav{display:flex;gap:8px}.btn{border:1px solid var(--line);background:var(--panel2);color:var(--txt);border-radius:8px;padding:8px 12px;font-weight:800;cursor:pointer;text-decoration:none}.btn:hover{border-color:var(--accent)}.page{padding:18px 22px}.note{background:#1b1820;border:1px solid #3b3144;color:#d5c4ef;border-radius:10px;padding:12px 14px;line-height:1.55;margin-bottom:16px}.strategy{background:var(--panel);border:1px solid var(--line);border-radius:14px;margin-bottom:22px;overflow:hidden}.strategy-head{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;background:#0d121c;border-bottom:1px solid var(--line)}.strategy-head h2{font-size:16px}.strategy-head span{color:var(--dim);font-size:12px}.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;padding:14px}.card{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:13px}.lab{font-size:11px;color:var(--dim);letter-spacing:.7px;text-transform:uppercase}.val{font-size:23px;font-weight:900;margin-top:7px;font-variant-numeric:tabular-nums}.sub{font-size:11px;color:var(--dim);margin-top:4px}.pos{color:var(--up);font-weight:800}.neg{color:var(--down);font-weight:800}.dist{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:0 14px 14px}.dist-card{background:#0b1019;border:1px solid var(--line);border-radius:12px;padding:12px}.dist-title{font-size:12px;font-weight:900;color:#fff;margin-bottom:9px}.chips{display:flex;flex-wrap:wrap;gap:7px}.chip{display:inline-flex;gap:6px;align-items:center;border:1px solid var(--line);background:rgba(255,255,255,.03);border-radius:999px;padding:5px 9px;color:#c9d4e5;font-size:12px}.chip b{color:#fff;font-variant-numeric:tabular-nums}.chip.buy{border-color:rgba(38,208,124,.35);background:rgba(38,208,124,.08)}.chip.wait{border-color:rgba(245,196,81,.35);background:rgba(245,196,81,.08)}.chip.no{border-color:rgba(255,77,106,.35);background:rgba(255,77,106,.08)}.chip.info{border-color:rgba(59,130,246,.35);background:rgba(59,130,246,.08)}.table{border-top:1px solid var(--line)}.row{display:grid;grid-template-columns:86px 78px 90px 138px 88px 88px 88px 86px 86px 86px 1fr;gap:8px;align-items:center;padding:10px 13px;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums}.trade-row{display:grid;grid-template-columns:86px 78px 90px 138px 88px 88px 88px 86px 86px 1fr;gap:8px;align-items:center;padding:10px 13px;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums}.head{color:var(--dim);font-size:11px;text-transform:uppercase;font-weight:900;background:#0b1019}.tk{font-size:15px;font-weight:900;color:#fff}.badge{display:inline-flex;padding:3px 8px;border-radius:999px;font-size:11px;font-weight:900;background:rgba(59,130,246,.16);color:#bfdbfe}.gate{background:rgba(245,196,81,.14);color:var(--gold)}.loading{padding:28px;text-align:center;color:var(--dim)}@media(max-width:1200px){.grid,.dist{grid-template-columns:repeat(2,1fr)}.row,.trade-row{grid-template-columns:78px 78px 120px 88px 1fr}.row span:nth-child(n+6):not(:last-child),.trade-row span:nth-child(n+6):not(:last-child){display:none}}@media(max-width:760px){.grid,.dist{grid-template-columns:1fr}.topbar{align-items:flex-start;gap:10px;flex-direction:column}.nav{flex-wrap:wrap}}
</style>
</head>
<body>
<div class="topbar">
  <div class="logo">KINGMAKER <span>GATE STRATEGY SIM</span></div>
  <div class="nav">
    <a class="btn" href="/elite-shadow">Elite Shadow</a>
    <button class="btn" onclick="manualTick()">전략 Tick</button>
    <button class="btn" onclick="load()">새로고침</button>
  </div>
</div>
<div class="page">
  <div class="note">
    실제 주문 없는 별도 모의전략입니다. <b>final_gate</b>는 최종 판단 로직으로 매수 허가된 후보만 사고, <b>pullback_only</b>는 눌림 재진입으로 확인된 후보만 삽니다.<br>
    화면은 10초마다 열린 가상 포지션의 현재가/손익을 다시 계산합니다. 신규 진입·청산 판단은 전략 tick에서만 수행됩니다.
  </div>
  <div id="root"><div class="loading">로딩...</div></div>
</div>
<script>
let DATA=null;
const REFRESH_MS=10000;
const fmt=(n,d=2)=>n==null||!isFinite(Number(n))?'—':Number(n).toFixed(d);
const pct=n=>n==null||!isFinite(Number(n))?'—':(Number(n)>=0?'+':'')+Number(n).toFixed(2)+'%';
const usd=n=>n==null||!isFinite(Number(n))?'—':(Number(n)>=0?'+':'-')+'$'+Math.abs(Number(n)).toLocaleString(undefined,{maximumFractionDigits:2});
const cls=n=>Number(n)>=0?'pos':'neg';
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function safe(n){const v=Number(n);return isFinite(v)?v:0}
function bucket(b){return {A_core:'A 핵심',B_stable:'B 안정',C_momentum:'C 모멘텀',watch:'관찰'}[b]||b}
function stage(s){return String(s||'').toUpperCase()}
function gateClass(k){k=String(k||'');if(k.startsWith('BUY'))return'buy';if(k.startsWith('WAIT'))return'wait';if(k.startsWith('NO_BUY'))return'no';return'info'}
function chipLabel(k){return String(k||'UNKNOWN').replace('BUY_PULLBACK_REENTRY','BUY_PULLBACK').replace('WAIT_OLD_SIGNAL_NEEDS_RESET','WAIT_OLD_RESET').replace('NO_BUY_LATE_CHASE','NO_LATE_CHASE').replace('NO_BUY_SIGNAL_FAILING','NO_SIGNAL_FAIL').replace('NO_BUY_NO_CURRENT_SIGNAL','NO_SIGNAL')}
function renderChips(obj){obj=obj||{};let items=Object.entries(obj).filter(([k,v])=>Number(v)>0).sort((a,b)=>Number(b[1])-Number(a[1]));return items.length?items.map(([k,v])=>`<span class="chip ${gateClass(k)}"><span>${esc(chipLabel(k))}</span><b>${v}</b></span>`).join(''):'<span class="chip info"><span>없음</span><b>0</b></span>'}
function renderDist(title,obj,sub){return `<div class="dist-card"><div class="dist-title">${esc(title)} ${sub?`<span class="sub">${esc(sub)}</span>`:''}</div><div class="chips">${renderChips(obj)}</div></div>`}
async function load(){const r=await fetch('/api/live/elite_strategy_sim?ts='+Date.now(),{cache:'no-store'});DATA=await r.json();render()}
async function manualTick(){document.getElementById('root').innerHTML='<div class="loading">전략 tick 실행 중...</div>';await fetch('/api/live/elite_strategy_sim_tick?max_candidates=93&ts='+Date.now(),{method:'POST',cache:'no-store'}).then(r=>r.json()).catch(()=>null);await load()}
function render(){const st=(DATA&&DATA.strategies)||{};document.getElementById('root').innerHTML=['final_gate','pullback_only'].map(name=>renderStrategy(name,st[name]||{})).join('')}
function renderStrategy(name,sim){
  const s=sim.summary||{},lt=sim.last_tick||{},pr=sim.price_refresh||{};
  const opens=(sim.open_positions||[]).slice().sort((a,b)=>safe(b.unrealized_pnl_pct)-safe(a.unrealized_pnl_pct));
  const trades=sim.recent_trades||[];
  const skipped=lt.skipped||{};
  const priceSub=pr.refreshed_at?`가격 ${pr.refreshed}/${pr.open_count} · ${pr.refreshed_at}`:'가격 갱신 대기';
  return `<div class="strategy"><div class="strategy-head"><h2>${name==='final_gate'?'1. 최종 판단 로직 매매 시뮬':'2. 눌림 종목만 매매 시뮬'} <span class="badge">${esc(name)}</span></h2><span>${lt.time?`마지막 tick ${lt.time} · 신규 ${lt.opened||0} · 청산 ${lt.closed||0} · 평가 ${lt.evaluated||0}`:'아직 tick 없음'} · ${esc(priceSub)}</span></div><div class="grid"><div class="card"><div class="lab">총 가상 투입</div><div class="val">${usd(s.total_notional)}</div><div class="sub">보유 ${usd(s.open_notional)} · 청산 ${usd(s.closed_notional)}</div></div><div class="card"><div class="lab">총 가상손익</div><div class="val ${cls(s.total_pnl_usd)}">${usd(s.total_pnl_usd)}</div><div class="sub">실현 ${usd(s.realized_pnl_usd)} · 미실현 ${usd(s.open_unrealized_usd)}</div></div><div class="card"><div class="lab">총 수익률</div><div class="val ${cls(s.total_roi_pct)}">${pct(s.total_roi_pct)}</div><div class="sub">투입금 대비</div></div><div class="card"><div class="lab">가상 보유</div><div class="val">${s.open_count||0}</div><div class="sub ${cls(s.open_roi_pct)}">보유 ROI ${pct(s.open_roi_pct)}</div></div><div class="card"><div class="lab">가상 청산</div><div class="val">${s.closed_count||0}</div><div class="sub">승률 ${fmt(s.win_rate,1)}%</div></div></div><div class="dist">${renderDist('보유 Gate 분포',sim.open_gate_counts||{})}${renderDist('최근 Tick Skip/Gate 분포',skipped,`후보 ${lt.candidate_count||0}`)}</div><div class="table"><div class="row head"><span>종목</span><span>Stage</span><span>Bucket</span><span>Gate</span><span>투자금</span><span>진입가</span><span>현재가</span><span>손익률</span><span>손익$</span><span>보유</span><span>신호 히스토리</span></div>${opens.length?opens.map(p=>`<div class="row"><span class="tk">${esc(p.ticker)}</span><span>${stage(p.stage)}</span><span>${bucket(p.bucket)}</span><span class="badge gate">${esc(p.gate)}</span><span>${usd(p.notional)}</span><span>${fmt(p.entry_price)}</span><span>${fmt(p.last_price)}</span><span class="${cls(p.unrealized_pnl_pct)}">${pct(p.unrealized_pnl_pct)}</span><span class="${cls(p.unrealized_pnl_usd)}">${usd(p.unrealized_pnl_usd)}</span><span>${p.holding_days||0}일</span><span>${historyText(p.signal_history)}</span></div>`).join(''):'<div class="loading">가상 보유 없음</div>'}</div><div class="table"><div class="trade-row head"><span>청산종목</span><span>Stage</span><span>Bucket</span><span>Gate</span><span>투자금</span><span>진입</span><span>청산</span><span>손익률</span><span>손익$</span><span>사유</span></div>${trades.length?trades.map(t=>`<div class="trade-row"><span class="tk">${esc(t.ticker)}</span><span>${stage(t.stage)}</span><span>${bucket(t.bucket)}</span><span class="badge gate">${esc(t.gate)}</span><span>${usd(t.notional)}</span><span>${fmt(t.entry_price)}</span><span>${fmt(t.exit_price)}</span><span class="${cls(t.pnl_pct)}">${pct(t.pnl_pct)}</span><span class="${cls(t.pnl_usd)}">${usd(t.pnl_usd)}</span><span>${esc(t.exit_reason)}</span></div>`).join(''):'<div class="loading">가상 청산 거래 없음</div>'}</div></div>`
}
function historyText(h){h=h||{};let v=h.proposed_vs_first_buy_pct;let r=h.ratio_retention;return `${h.first_buy_date||'—'} · ${h.consecutive_buy_days||0}일 · 첫BUY대비 ${pct(v)} · ratio유지 ${r==null?'—':fmt(r*100,0)+'%'}`}
load().catch(e=>{document.getElementById('root').innerHTML='<div class="loading">로드 실패: '+esc(e)+'</div>'});
setInterval(()=>load().catch(()=>null),REFRESH_MS);
</script>
</body>
</html>
